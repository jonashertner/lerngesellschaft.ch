name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  publish-approved-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify approved publication branch and request Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pages_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" --jq '.object.sha')"
          test "$pages_sha" = "2765d4ad992298f00c0491231ef1d816fcca00cb"
          pages_source="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.source | .branch + ":" + .path')"
          test "$pages_source" = "gh-pages:/"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
