name: Booking availability and recovery
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: booking-recovery
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reconcile interrupted reservations
        env:
          BOOKING_MAINTENANCE_TOKEN: ${{ secrets.BOOKING_MAINTENANCE_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 170 \
            -X POST -H "Authorization: Bearer $BOOKING_MAINTENANCE_TOKEN" \
            https://lernbus-booking-api.voilajonas.chatgpt.site/api/maintenance
